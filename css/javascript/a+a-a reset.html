<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset</title>
</head>
<body>
    <h1 id="a">hello</h1>
    <h2 id="b">welcome</h2>
    <button onclick="a1()">a+</button>
    <button onclick="a2()">a-</button>
    <button onclick="a3()">reset</button>
    <script>
        function a1(){
            document.body.style.fontSize="100px"
        }
         function a2(){
            document.body.style.fontSize="10px"
        }
         function a3(){
            document.body.style.fontSize=""
        }
        
    </script>

</body>
    
</body>
</html>
