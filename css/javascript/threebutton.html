<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>threebutton</title>
    <style>
        
    </style>
</head>
<body>
    <button onclick="mode()">red

    </button>
    <button onclick="mode1()">blue</button >
    <button onclick="mode2()">green</button>
    <script>
        function mode(){
            document.body.style.backgroundColor="red";
        }
        function mode1(){
            document.body.style.backgroundColor="blue"
        }
        function mode2(){
            document.body.style.backgroundColor="green"
        }
    </script>
    
</body>
</html>
