<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            margin-top: 30px;
        }

        input {
            width: 250px;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .card {
            width: 300px;
            margin: 30px auto;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            background: white;
            display: none;
            box-shadow: 0 0 10px gray;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            font-size: 18px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Information</h2>

    <input type="text" id="name" placeholder="Enter Name"><br>
    <input type="text" id="course" placeholder="Enter Course"><br>
    <input type="text" id="mobile" placeholder="Enter Mobile"><br>

    <button onclick="showCard()">Generate ID Card</button>
</div>

<div class="card" id="idCard">
    <h2>STUDENT ID CARD</h2>
    <p><strong>Name:</strong> <span id="sName"></span></p>
    <p><strong>Course:</strong> <span id="sCourse"></span></p>
    <p><strong>Mobile:</strong> <span id="sMobile"></span></p>
</div>

<script>
function showCard() {
    document.getElementById("sName").innerText =
        document.getElementById("name").value;

    document.getElementById("sCourse").innerText =
        document.getElementById("course").value;

    document.getElementById("sMobile").innerText =
        document.getElementById("mobile").value;

    document.getElementById("idCard").style.display = "block";
}
</script>

</body>
</html>
