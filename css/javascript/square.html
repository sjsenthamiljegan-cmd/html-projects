<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>square</title>
    <style>
        div{
            padding: 200px;
            height: 50px;
            width: 50px;
            background-color: blue;
            transition: 2s;
        }
       
    </style>
</head>
<body>
    <div id="s"> 

<button onclick="s1()" ondblclick="s2()">square</button>


        </div>
        <script>
            function s1(){
                document.getElementById("s").style.backgroundColor="orange"
                document.getElementById("s").style.height="200px"
                document.getElementById("s").style.width="200px"
            
            }
             function s2(){
                document.getElementById("s").style.backgroundColor="red"
                document.getElementById("s").style.height="300px"
                document.getElementById("s").style.width="300px"

            }
    

        </script>
    
</body>
</html>
