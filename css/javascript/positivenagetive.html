</head>
<body>
    <input type="text" id="s">
    <button onclick="pasneg()">submit</button>
    <p id="s2"></p>
    <script>
        function pasneg(){

           if(a>0)

            document.write("postive")

            document.write("negetive")
           }
            
        }
    </script>
