<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        #box1{
            background-color: blueviolet;
            height: 200px;
            width: 200px;
        }
        #box2{
            background-color: brown;
            height: 200px;
            width: 200px;
            position: relative;
            top: 100px;
            left: 100px;
        }
        #box3{
            background-color: blue;
               height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
    
</body>
</html>
