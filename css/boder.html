<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            border: 2px solid green ;
            padding-top: 50px;
            padding-bottom: 50px; 
            margin-top: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-decoration: double;
            text-shadow: 10px;
            background-color: blanchedalmond;
        }
    
           h1:hover {

            color: blueviolet;
            border: 2px solid rgb(128, 0, 0) ;
            padding-top: 50px;
            padding-bottom: 50px; 
            margin-top: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-decoration: double;
            text-shadow: 10px;
            background-color: rgb(240, 141, 12);
        }
        img{
            height: 300px;
            width: 300px;
            border-radius: 50% ;
        }
        img:hover{
            height: 50%;
            width: 50%;
            border-radius:0%  ;
            
        }
    </style>

    
    
</head>
<body>
    <center>
    <h1>jegan</h1>
    <img src="14.jpeg" alt="caption">
    </center>
</body>
</html>
