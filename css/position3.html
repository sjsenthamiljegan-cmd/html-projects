<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: aqua;
            position: relative;
            height: 550px;
            width: 440px;
            z-index: 1;
        }
        .box2{
            background-color: blue;
            position: absolute;
            top: 20px;
            left: 30px;
            height: 550px;
            width: 440px;
            z-index: 0;
        }
        
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    
</body>
</html>
